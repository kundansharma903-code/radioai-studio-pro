<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song Categories — RadioAI Studio Pro</title>
<link rel="stylesheet" href="shared.css">
<style>
body{overflow:hidden}
.dialog-wrap{display:flex;flex-direction:column;height:100vh}
.dialog-header{display:flex;align-items:center;gap:12px;padding:16px 24px;background:var(--surf);border-bottom:1px solid var(--b1)}
.dialog-icon{width:40px;height:40px;border-radius:50%;background:var(--p4);display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--p1)}
.dialog-title{font-size:20px;font-weight:700}
.dialog-subtitle{font-size:11px;color:var(--t3)}
.dialog-close{margin-left:auto;width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--b1);display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:16px;cursor:pointer}
.dialog-close:hover{background:var(--b1);color:var(--t1)}
.dialog-body{flex:1;display:flex;overflow:hidden}

/* Left panel */
.cat-list-panel{width:320px;min-width:280px;border-right:1px solid var(--b1);display:flex;flex-direction:column}
.cat-list-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--b1)}
.cat-list-title{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase}
.cat-count{font-size:10px;color:var(--t3);background:var(--card);padding:2px 8px;border-radius:8px}
.cat-list{flex:1;overflow-y:auto;padding:4px 0}
.cat-list::-webkit-scrollbar{width:6px}
.cat-list::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
.cat-item{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;border-left:3px solid transparent;transition:background 0.1s}
.cat-item:hover{background:var(--card)}
.cat-item.active{background:var(--p4);border-left-color:var(--p1)}
.cat-num{font-size:11px;font-weight:700;color:var(--t3);width:18px;text-align:center;font-family:'Roboto Mono',monospace}
.cat-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.cat-name-area{flex:1}
.cat-name{font-size:13px;font-weight:600}
.cat-desc-small{font-size:10px;color:var(--t3)}
.cat-song-count{font-size:10px;color:var(--t2);background:var(--card2);padding:2px 8px;border-radius:8px;white-space:nowrap}

.cat-actions{display:flex;gap:6px;padding:12px 16px;border-top:1px solid var(--b1)}
.cat-action-btn{flex:1;padding:7px;border-radius:var(--radius);font-family:'Inter',sans-serif;font-size:11px;font-weight:600;cursor:pointer;text-align:center;border:none}
.btn-add{background:var(--gn);color:#fff}
.btn-add:hover{opacity:0.85}
.btn-rename{background:var(--am);color:#000}
.btn-rename:hover{opacity:0.85}
.btn-delete{background:transparent;color:var(--rs);border:1px solid var(--rs)}
.btn-delete:hover{background:var(--rsD)}
.cat-footer{padding:8px 16px;font-size:9px;color:var(--t3);border-top:1px solid var(--b1)}

/* Right panel */
.cat-edit-panel{flex:1;padding:20px 24px;overflow-y:auto}
.cat-edit-panel::-webkit-scrollbar{width:6px}
.cat-edit-panel::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}
.edit-section-title{font-size:11px;font-weight:600;color:var(--t3);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:12px}
.form-group{margin-bottom:16px}
.form-label{font-size:10px;color:var(--t3);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.5px}
.form-label .req{color:var(--rs)}
.form-input{width:100%;padding:8px 12px;background:var(--card);border:1px solid var(--b1);border-radius:var(--radius);color:var(--t1);font-size:13px;font-family:'Inter',sans-serif}
.form-input:focus{outline:none;border-color:var(--p1)}
.form-select{width:100%;padding:8px 12px;background:var(--card);border:1px solid var(--b1);border-radius:var(--radius);color:var(--t1);font-size:12px;font-family:'Inter',sans-serif;appearance:none;cursor:pointer}

/* Color picker */
.color-dots{display:flex;gap:8px;flex-wrap:wrap}
.color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color 0.15s,transform 0.1s}
.color-dot:hover{transform:scale(1.15)}
.color-dot.active{border-color:#fff;transform:scale(1.15)}

/* Songs in category */
.songs-header{display:flex;align-items:center;justify-content:space-between}
.songs-badge{font-size:10px;font-weight:600;padding:2px 10px;border-radius:8px}
.song-mini-list{margin-top:8px}
.song-mini-item{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11px;color:var(--t2)}
.song-mini-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.song-mini-more{font-size:10px;color:var(--t3);margin-top:4px;cursor:pointer}
.song-mini-more:hover{color:var(--p1)}

.save-btn{width:100%;padding:12px;background:var(--p1);color:#fff;border:none;border-radius:var(--radius);font-family:'Inter',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:6px}
.save-btn:hover{background:var(--p2)}
.close-link{display:block;text-align:center;margin-top:10px;font-size:12px;color:var(--t3);cursor:pointer}
.close-link:hover{color:var(--t1)}
</style>
</head>
<body>
<div class="dialog-wrap">

  <!-- Header -->
  <div class="dialog-header">
    <div class="dialog-icon">((●))</div>
    <div>
      <div class="dialog-title">SONG CATEGORIES</div>
      <div class="dialog-subtitle">Create and manage song rotation categories</div>
    </div>
    <div class="dialog-close" onclick="closeDialog()">✕</div>
  </div>

  <div class="dialog-body">

    <!-- Left: Category List -->
    <div class="cat-list-panel">
      <div class="cat-list-header">
        <div class="cat-list-title">CATEGORIES</div>
        <div class="cat-count" id="cat-count">0 TOTAL</div>
      </div>
      <div class="cat-list" id="cat-list"></div>
      <div class="cat-actions">
        <button class="cat-action-btn btn-add" onclick="addCategory()">+ Add</button>
        <button class="cat-action-btn btn-rename" onclick="renameCategory()">✎ Rename</button>
        <button class="cat-action-btn btn-delete" onclick="deleteCategory()">✕ Delete</button>
      </div>
      <div class="cat-footer">Changes are saved immediately to the database</div>
    </div>

    <!-- Right: Edit Category -->
    <div class="cat-edit-panel">
      <div class="edit-section-title">EDIT CATEGORY</div>

      <div class="form-group">
        <div class="form-label">Category Name <span class="req">*</span></div>
        <input class="form-input" type="text" id="cat-name" placeholder="Enter category name">
      </div>

      <div class="form-group">
        <div class="form-label">Category Color</div>
        <div class="color-dots" id="color-picker">
          <div class="color-dot active" style="background:#F59E0B" data-color="#F59E0B" onclick="pickColor(this)"></div>
          <div class="color-dot" style="background:#8B5CF6" data-color="#8B5CF6" onclick="pickColor(this)"></div>
          <div class="color-dot" style="background:#A78BFA" data-color="#A78BFA" onclick="pickColor(this)"></div>
          <div class="color-dot" style="background:#10B981" data-color="#10B981" onclick="pickColor(this)"></div>
          <div class="color-dot" style="background:#06B6D4" data-color="#06B6D4" onclick="pickColor(this)"></div>
          <div class="color-dot" style="background:#F43F5E" data-color="#F43F5E" onclick="pickColor(this)"></div>
          <div class="color-dot" style="background:#EC4899" data-color="#EC4899" onclick="pickColor(this)"></div>
          <div class="color-dot" style="background:#14B8A6" data-color="#14B8A6" onclick="pickColor(this)"></div>
          <div class="color-dot" style="background:#6D28D9" data-color="#6D28D9" onclick="pickColor(this)"></div>
          <div class="color-dot" style="background:#3B82F6" data-color="#3B82F6" onclick="pickColor(this)"></div>
        </div>
      </div>

      <div class="form-group">
        <div class="form-label">Description</div>
        <input class="form-input" type="text" id="cat-desc" placeholder="Short description">
      </div>

      <div class="form-group">
        <div class="form-label">Auto-Rotate Songs</div>
        <select class="form-select" id="cat-rotate">
          <option>Rotate after 1 play</option>
          <option>Rotate after 2 plays</option>
          <option>Rotate after 3 plays</option>
          <option>Rotate after 5 plays</option>
          <option>No rotation</option>
        </select>
      </div>

      <div class="form-group">
        <div class="form-label">Min Separation Time</div>
        <select class="form-select" id="cat-separation">
          <option value="60">60 minutes</option>
          <option value="120" selected>120 minutes</option>
          <option value="180">180 minutes</option>
          <option value="240">240 minutes</option>
          <option value="360">360 minutes</option>
          <option value="480">480 minutes</option>
        </select>
      </div>

      <div class="form-group">
        <div class="songs-header">
          <div class="form-label" style="margin:0">Songs in this category</div>
          <div class="songs-badge" id="songs-badge" style="background:var(--p4);color:var(--p1)">0 songs</div>
        </div>
        <div class="song-mini-list" id="song-mini-list"></div>
      </div>

      <button class="save-btn" onclick="saveCategory()">✓ Save Category</button>
      <div class="close-link" onclick="closeDialog()">✕ Close</div>
    </div>

  </div>
</div>

<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="js/bridge_helper.js"></script>
<script>
var categories = [];
var selectedIdx = 0;
var selectedColor = '#8B5CF6';

onBridgeReady(function(){ loadCategories(); });

function loadCategories(){
  callBridgeAsync('get_categories_full', [], function(data){
    if(!data) return;
    categories = data;
    renderCatList();
    if(categories.length > 0) selectCategory(0);
  });
}

function renderCatList(){
  var list = document.getElementById('cat-list');
  list.innerHTML = '';
  document.getElementById('cat-count').textContent = categories.length + ' TOTAL';
  categories.forEach(function(c, i){
    var div = document.createElement('div');
    div.className = 'cat-item' + (i === selectedIdx ? ' active' : '');
    div.onclick = function(){ selectCategory(i); };
    div.innerHTML = '<div class="cat-num">'+(i+1)+'</div>'
      + '<div class="cat-dot" style="background:'+c.color+'"></div>'
      + '<div class="cat-name-area"><div class="cat-name">'+c.name+'</div>'
      + '<div class="cat-desc-small">'+(c.description||'')+'</div></div>'
      + '<div class="cat-song-count">'+c.song_count+' songs</div>';
    list.appendChild(div);
  });
}

function selectCategory(idx){
  selectedIdx = idx;
  var c = categories[idx];
  if(!c) return;
  document.querySelectorAll('.cat-item').forEach(function(el,i){ el.classList.toggle('active',i===idx); });
  document.getElementById('cat-name').value = c.name;
  document.getElementById('cat-desc').value = c.description || '';
  selectedColor = c.color;
  // Highlight color dot
  document.querySelectorAll('.color-dot').forEach(function(d){
    d.classList.toggle('active', d.getAttribute('data-color') === c.color);
  });
  // Set rotation dropdown
  var rotSel = document.getElementById('cat-rotate');
  for(var i=0;i<rotSel.options.length;i++){
    if(rotSel.options[i].text === c.auto_rotate){ rotSel.selectedIndex=i; break; }
  }
  // Set separation dropdown
  document.getElementById('cat-separation').value = String(c.separation_min || 120);
  // Songs badge
  document.getElementById('songs-badge').textContent = c.song_count + ' songs';
  // Load songs in category
  callBridgeAsync('get_songs_in_category', [c.id], function(songs){
    var list = document.getElementById('song-mini-list');
    list.innerHTML = '';
    if(!songs || songs.length === 0){
      list.innerHTML = '<div style="font-size:10px;color:var(--t3)">No songs in this category</div>';
      return;
    }
    var show = Math.min(songs.length, 5);
    for(var i=0;i<show;i++){
      list.innerHTML += '<div class="song-mini-item"><div class="song-mini-dot" style="background:'+c.color+'"></div>'+songs[i].artist+' — '+songs[i].title+'</div>';
    }
    if(songs.length > 5){
      list.innerHTML += '<div class="song-mini-more">+ '+(songs.length-5)+' more...</div>';
    }
  });
}

function pickColor(el){
  document.querySelectorAll('.color-dot').forEach(function(d){ d.classList.remove('active'); });
  el.classList.add('active');
  selectedColor = el.getAttribute('data-color');
}

function saveCategory(){
  var c = categories[selectedIdx];
  if(!c) return;
  var payload = JSON.stringify({
    id: c.id,
    name: document.getElementById('cat-name').value,
    color: selectedColor,
    description: document.getElementById('cat-desc').value,
    auto_rotate: document.getElementById('cat-rotate').options[document.getElementById('cat-rotate').selectedIndex].text,
    separation_min: parseInt(document.getElementById('cat-separation').value)
  });
  callBridgeAsync('save_category', [payload], function(data){
    if(data){ showToast('Category saved!', true); loadCategories(); }
    else showToast('Save failed', false);
  });
}

function addCategory(){
  var name = prompt('New category name:');
  if(!name) return;
  var payload = JSON.stringify({name: name, color: '#8B5CF6', description: '', auto_rotate: 'Rotate after 1 play', separation_min: 120});
  callBridgeAsync('save_category', [payload], function(data){
    if(data){ showToast('Category "'+name+'" created!', true); loadCategories(); }
    else showToast('Failed to create', false);
  });
}

function renameCategory(){
  var c = categories[selectedIdx];
  if(!c) return;
  var newName = prompt('Rename "'+c.name+'" to:', c.name);
  if(!newName || newName === c.name) return;
  var payload = JSON.stringify({id: c.id, name: newName, color: c.color, description: c.description, auto_rotate: c.auto_rotate, separation_min: c.separation_min});
  callBridgeAsync('save_category', [payload], function(data){
    if(data){ showToast('Renamed to "'+newName+'"', true); loadCategories(); }
    else showToast('Rename failed', false);
  });
}

function deleteCategory(){
  var c = categories[selectedIdx];
  if(!c) return;
  if(!confirm('Delete category "'+c.name+'"?\n\nThis cannot be undone.')) return;
  callBridgeAsync('delete_category', [c.id], function(data){
    if(data){ showToast('Category deleted', true); selectedIdx=0; loadCategories(); }
    else showToast('Cannot delete — songs may be using this category', false);
  });
}

function closeDialog(){
  window.location.href = 'songs_library.html';
}

function showToast(msg, success){
  var t = document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast';
    t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 24px;border-radius:8px;font-size:12px;font-weight:600;z-index:999;transition:opacity 0.3s;pointer-events:none;';
    document.body.appendChild(t); }
  t.textContent=msg; t.style.background=success?'#10B981':'#F43F5E'; t.style.color='#fff'; t.style.opacity='1';
  clearTimeout(t._timer); t._timer=setTimeout(function(){t.style.opacity='0';},3000);
}
</script>
</body>
</html>
